# cc-managed: project-board-automation v2
# =============================================================================
# Project Board Automation - cognitive-core
# =============================================================================
# Moves issues on the GitHub project board and enforces the approval gate.
# All logic lives in .claude/skills/project-board/ci/board-automation.sh,
# read from the default branch. Settings come from cognitive-core.conf
# (CC_GITHUB_OWNER, CC_PROJECT_NUMBER, CC_REQUIRE_HUMAN_APPROVAL); project,
# field and option IDs are looked up by name.
#
# With CC_REQUIRE_HUMAN_APPROVAL=true (default):
#   PR opened -> linked issues Todo -> In Progress
#   PR merged -> linked issues -> To Be Tested
#   Issue closed without the `approved` label -> To Be Tested, reopened
#   Issue closed with `approved` from To Be Tested -> Done
#   Issue closed as not planned / duplicate -> Canceled
# With false: PR merged and issue closed -> Done.
#
# Token: GitHub App (secrets REVIEWER_APP_ID, REVIEWER_APP_PRIVATE_KEY) or
# secret PROJECT_PAT (classic PAT: repo, project, read:org). Without either,
# the workflow does nothing. Turn off the board's built-in workflows
# "Item closed" and "Pull request merged", they bypass the gate.
# Daily reconciliation: project-board-reconcile.yml.
# Managed by cognitive-core update.sh; list it in CC_LOCAL_OVERRIDES to own it.
# =============================================================================
name: Project Board Automation

on:
  pull_request:
    types: [opened, ready_for_review, closed]
  issues:
    types: [opened, assigned, closed, reopened]

permissions:
  contents: read

concurrency:
  group: board-${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.REVIEWER_APP_ID != '' }}
    steps:
      - name: App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout board script and conf (default branch)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /cognitive-core.conf
            /.claude/cognitive-core.conf
            /.claude/skills/project-board/
            /core/skills/project-board/
      - name: Route event
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.PROJECT_PAT }}
        run: |
          for s in .claude/skills/project-board/ci/board-automation.sh core/skills/project-board/ci/board-automation.sh; do
            if [ -f "$s" ]; then exec bash "$s" event; fi
          done
          echo "::notice::board-automation.sh not found (project-board skill not installed) - skipped"
