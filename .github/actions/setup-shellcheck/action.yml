name: Setup pinned ShellCheck
description: Install a checksum-verified ShellCheck release and put it on PATH
inputs:
  version:
    description: ShellCheck release tag
    default: v0.11.0
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SC_VERSION: ${{ inputs.version }}
      run: |
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   asset=linux.x86_64;   sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 ;;
          macOS-ARM64) asset=darwin.aarch64; sum=56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79 ;;
          *) echo "no pinned ShellCheck for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        cd "$RUNNER_TEMP"
        curl -fsSL -o sc.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.${asset}.tar.xz"
        echo "${sum}  sc.tar.xz" | shasum -a 256 -c -
        tar -xJf sc.tar.xz
        mkdir -p bin
        mv "shellcheck-${SC_VERSION}/shellcheck" bin/
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
        "${RUNNER_TEMP}/bin/shellcheck" --version | grep -q "^version: ${SC_VERSION#v}$"
